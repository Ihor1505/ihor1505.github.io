<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BABLOSA — Prototype (EN)</title>
<style>
:root{
  --bg:#0b3d2e; --panel:#0f4a37; --gold:#e6c458; --gold-dark:#b8912e;
  --text:#f2ead6; --muted:#9fcbb8; --win:#4caf50; --lose:#e05555;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#07281e; --panel:#0b3a2c; } }
:root[data-theme="dark"]{ --bg:#07281e; --panel:#0b3a2c; }
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,sans-serif; display:flex; justify-content:center;}
.app{width:100%; max-width:440px; padding:14px 12px 32px;}
h1{font-size:1.15rem; text-align:center; letter-spacing:1px; margin:6px 0 2px;}
.balance{text-align:center; font-size:1.05rem; margin-bottom:2px; color:var(--gold);}
.lives{text-align:center; font-size:.85rem; margin-bottom:10px; color:var(--muted);}
.lives .heart{color:#e05555;} .lives .heart.empty{color:#3a4d44;}
.section{background:var(--panel); border-radius:14px; padding:10px; margin-bottom:10px;}
.section.merge-top{margin-bottom:0; border-bottom-left-radius:0; border-bottom-right-radius:0; padding-bottom:6px;}
.section.merge-bottom{border-top-left-radius:0; border-top-right-radius:0; padding-top:6px;}
.label{font-size:.8rem; color:var(--muted); margin-bottom:8px; text-align:center;}
.coins{display:flex; justify-content:center; gap:8px; flex-wrap:wrap;}
.coins:empty{display:none;}
.coin-wrap{display:flex; flex-direction:column; align-items:center; gap:3px;}
.coin{
  width:52px; height:52px; border-radius:50%; position:relative; cursor:pointer;
  box-shadow:0 3px 6px rgba(0,0,0,.4);
}
.coin img{width:100%; height:100%; border-radius:50%; display:block; pointer-events:none;}
.coin.bank{cursor:default;}
.coin.spin img{ animation:flip var(--flip-dur, .75s) linear; }
@keyframes flip{ 0%{transform:scaleX(1);} 50%{transform:scaleX(0);} 100%{transform:scaleX(1);} }
.coin.matched{box-shadow:0 0 0 3px var(--win), 0 3px 6px rgba(0,0,0,.4);}
/* Монета игрока, только что выбранная из кошелька, "прилетает" сверху в поле ставки. */
.coin-wrap.fly-in-down{ animation:flyInDown .35s ease-out; }
@keyframes flyInDown{ 0%{transform:translateY(-46px); opacity:0;} 100%{transform:translateY(0); opacity:1;} }
/* Монета банка "прилетает" в поле "Монеты банка" с правой стороны. */
.coin-wrap.fly-in-right{ animation:flyInRight .35s ease-out; }
@keyframes flyInRight{ 0%{transform:translateX(70px); opacity:0;} 100%{transform:translateX(0); opacity:1;} }
/* После "Стоп": выигранные монеты улетают из поля "Монеты в игре" в кошелек (вверх, с уменьшением). */
.coin-wrap.fly-to-wallet{ animation:flyToWallet .5s ease-in forwards; }
@keyframes flyToWallet{ 0%{transform:translateY(0) scale(1); opacity:1;} 100%{transform:translateY(-90px) scale(.35); opacity:0;} }
/* Проигранные монеты вылетают вправо из поля "Монеты в игре". */
.coin-wrap.fly-out-right{ animation:flyOutRight .5s ease-in forwards; }
@keyframes flyOutRight{ 0%{transform:translateX(0); opacity:1;} 100%{transform:translateX(140px); opacity:0;} }
.denom-badge{
  position:absolute; right:-3px; bottom:-3px; background:#0c2c21; color:var(--gold);
  border-radius:8px; font-size:.6rem; font-weight:700; padding:1px 4px; line-height:1.2;
  border:1px solid var(--gold-dark);
}
.remove{
  width:18px; height:18px; border-radius:50%; border:none; background:#c94b4b; color:#fff;
  font-size:.65rem; line-height:1; cursor:pointer; padding:0;
}
.palette{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:8px;}
.denom-btn{
  padding:2px; border:none; background:none;
  cursor:pointer; min-width:44px;
}
.denom-btn:disabled{opacity:.3; cursor:default;}
.denom-btn{display:flex; flex-direction:column; align-items:center; line-height:1.2;}
.denom-btn-coin{position:relative; display:block;}
.denom-btn-img{width:44px; height:44px; border-radius:50%; display:block; pointer-events:none;}
#walletArea .denom-btn-img{width:52px; height:52px; filter:brightness(1.3) saturate(1.1);}
#walletArea .denom-btn:disabled{opacity:.9;}
.wallet-overview{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;}
.wallet-chip{background:#0c2c21; border:1px solid var(--gold-dark); border-radius:8px; padding:4px 8px; font-size:.75rem; color:var(--gold); font-weight:700;}
.wallet-chip .chip-count{color:var(--muted); font-weight:400; margin-left:2px;}
.denom-btn.active .denom-btn-img{box-shadow:0 0 0 2px var(--gold);}
.wallet-chip.removable{cursor:pointer;}
.exchange-toggle{width:100%; padding:8px; margin-bottom:8px; background:none; border:1px solid var(--gold-dark); color:var(--gold); border-radius:8px; font-size:.8rem; font-weight:600; cursor:pointer;}
.exchange-toggle:disabled{opacity:.3; cursor:default;}
.exchange-toggle.active{background:var(--gold-dark); color:var(--text);}
.wallet-actions{display:flex; gap:8px; margin-bottom:8px;}
.wallet-actions button{white-space:nowrap; padding:8px 4px;}
.wallet-actions .exchange-toggle{width:auto; flex:1; margin-bottom:0;}
.stake-all-btn{flex:1; padding:8px 4px; background:var(--gold); color:#3a2c05; border-radius:8px; font-size:.8rem; font-weight:700; cursor:pointer; border:none;}
.stake-all-btn:disabled{opacity:.3; cursor:default;}
.exchange-row{display:flex; align-items:center; gap:8px; margin:8px 0; font-size:.8rem; color:var(--muted); flex-wrap:wrap;}
.exchange-row select, .exchange-row input{background:#0c2c21; color:var(--text); border:1px solid var(--gold-dark); border-radius:6px; padding:4px 6px; font-size:.8rem;}
.exchange-row input{width:60px;}
.exchange-preview{font-size:.75rem; color:var(--gold); text-align:center; margin:6px 0;}
.exchange-confirm{width:100%; padding:8px; background:var(--gold); color:#3a2c05; border-radius:8px; font-weight:700; cursor:pointer;}
.exchange-confirm:disabled{opacity:.3; cursor:default;}
.recover-row{display:flex; align-items:stretch; gap:8px; margin-top:2px;}
.recover-btn{flex:1; padding:12px 6px; border-radius:12px; border:none; font-weight:700; font-size:.85rem; cursor:pointer; text-align:center; line-height:1.3;}
.recover-btn .sub{display:block; font-weight:400; font-size:.7rem; margin-top:4px; opacity:.9;}
.recover-btn.life{background:#e05555; color:#fff;}
.recover-btn:disabled{opacity:.45; cursor:default;}
.recover-btn.ad{background:#3b82c4; color:#fff;}
.recover-or{align-self:center; font-size:.78rem; color:var(--muted); padding:0 2px;}
.recover-timer{text-align:center; font-size:.8rem; color:var(--muted); margin-top:8px;}
.stake-line{display:flex; align-items:center; gap:6px; font-size:.75rem; color:var(--muted); margin:2px 2px 10px; white-space:nowrap;}
.stake-line .stake-label{color:var(--text); font-weight:700; flex-shrink:0;}
.stake-line span:not(.stake-label){flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis;}
.clear-btn{background:none; border:1px solid var(--muted); color:var(--muted); border-radius:8px; padding:4px 8px; font-size:.7rem; cursor:pointer; flex-shrink:0;}
.guess{display:flex; gap:8px; margin-top:2px;}
.guess button{flex:1; padding:8px; border-radius:10px; border:2px solid transparent; background:#0c2c21; color:var(--text); font-weight:600; cursor:pointer;}
.guess button.active{border-color:var(--gold); background:#173d2c; color:var(--gold);}
.controls{display:flex; gap:10px; margin:10px 0;}
button{border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; background:var(--gold); color:#3a2c05;}
.controls button{flex:1; padding:7px 10px;}
button:disabled{opacity:.4; cursor:default;}
#stopBtn{background:#c94b4b; color:#fff;}
#againBtn{background:var(--muted); color:#06281e;}
.result{text-align:center; font-size:1.05rem; font-weight:700; margin:4px 0; white-space:nowrap;}
.result:empty{display:none;}
.result .sub{font-size:.8rem; font-weight:400; color:var(--muted); display:block;}
.result.win{color:var(--win);} .result.lose{color:var(--lose);}
.stats{text-align:center; font-size:.78rem; color:var(--muted);}
.reset-line{text-align:center; margin-top:10px;}
.reset-line button{background:none; border:1px solid var(--muted); color:var(--muted); border-radius:8px; padding:6px 12px; font-size:.72rem; font-weight:400; cursor:pointer;}
.hint{text-align:center; font-size:1rem; font-weight:600; color:var(--muted); margin:2px 0 8px;}
.note{text-align:center; font-size:.75rem; color:var(--gold);}
.note:empty{display:none;}
.placeholder{text-align:center; font-size:.78rem; color:var(--muted); padding:4px 0;}
.warn{text-align:center; font-size:.8rem; color:var(--lose); padding:6px 0;}
.life-box{text-align:center; padding:10px 0;}
.life-box .life-btn{width:100%; padding:9px; background:#e05555; color:#fff;}
.life-box .timer{font-size:.85rem; color:var(--muted); margin-top:6px;}
</style>
</head>
<body>
<div class="app">
  <h1>BABLOSA — Prototype</h1>
  <div class="balance">Balance: <span id="balance">5</span> bablos</div>
  <div class="lives" id="livesLine"></div>

  <div class="section" id="outOfCoinsSection" style="display:none"></div>

  <div id="gameplayArea">
    <div class="section" id="walletSection">
      <div class="hint">Your Wallet</div>
      <div class="label" id="walletHint"></div>
      <div id="walletArea"></div>
      <div class="wallet-actions">
        <button type="button" class="exchange-toggle" id="toggleExchangeBtn">Exchange Coins</button>
        <button type="button" class="stake-all-btn" id="stakeAllBtn">Stake All</button>
      </div>
      <div id="exchangeArea" style="display:none"></div>
    </div>

    <div class="section" id="stakeArea" style="display:none">
      <div class="label" id="inGameLabel" style="display:none">Coins in Play</div>
      <div id="stakeInfoArea"></div>
      <div class="coins" id="playerCoins"></div>
    </div>

    <div class="section" id="bankSection">
      <div class="label" id="bankLabel">Bank's Coins</div>
      <div class="coins" id="bankCoins"></div>
      <div class="note" id="bankNote"></div>
    </div>

    <div class="section" id="guessSection">
      <div class="label">Guess which side will have more coins</div>
      <div class="guess">
        <button type="button" id="guessH" disabled>Heads</button>
        <button type="button" id="guessT" disabled>Tails</button>
      </div>
    </div>

    <div class="controls">
      <button type="button" id="shakeBtn" disabled>Shake</button>
      <button type="button" id="stopBtn" disabled>STOP</button>
      <button type="button" id="againBtn" style="display:none">Play</button>
    </div>
    <div class="result" id="result"></div>
  </div>

  <div class="stats">Rounds played: <span id="roundsCount">0</span> · Wins: <span id="winsCount">0</span></div>
  <div class="reset-line">
    <button type="button" id="resetBtn">Start Over (reset progress)</button>
  </div>
</div>

function imgFor(c){
  if(c.face==='H') return COIN_IMG.H;
  // У каждого номинала теперь своя уникальная картинка (см. COIN_IMG);
  // на всякий случай подстраховываемся самой крупной монетой, если для
  // какого-то номинала изображение вдруг не найдётся.
  return COIN_IMG[String(c.denom)] || COIN_IMG['100000'] || COIN_IMG['100'];
}

const ALL_DENOMS = [1,2,5,10,25,50,100,200,500,1000,2000,5000,10000,50000,100000];
const LIVES_MAX = 5;
const STARTER_SET = {1:1, 2:1, 5:1, 10:1, 25:1}; // набор, который выдаётся в начале игры и за каждую жизнь
const LIFE_VALUE = Object.entries(STARTER_SET).reduce((s,[d,n])=> s + d*n, 0); // суммарная ценность набора, для отображения
const LIFE_REGEN_MS = 5*60*1000;   // 5 minutes

// ---- Physical coin wallet ----
// Баланс больше не абстрактное число — это сумма конкретных монет,
// которыми реально владеет игрок. wallet хранит количество монет по
// каждому номиналу, например {1:5, 2:2}.
function loadWallet(){
  try{
    const raw = localStorage.getItem('bablosa_wallet');
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed === 'object') return parsed;
    }
  }catch(e){}
  return {...STARTER_SET}; // новый игрок начинает с одной монетой каждого из номиналов 1, 2, 5, 10, 25
}
function walletTotal(){
  return ALL_DENOMS.reduce((s,d)=> s + (wallet[d]||0)*d, 0);
}
function addToWallet(d, n){ wallet[d] = (wallet[d]||0) + (n||1); }
function removeFromWallet(d, n){ wallet[d] = Math.max(0, (wallet[d]||0) - (n||1)); }
function countInStake(d){ return playerCoins.filter(c=>c.denom===d).length; }
function walletAvailable(d){ return (wallet[d]||0) - countInStake(d); }
function syncBalance(){ balance = walletTotal(); }

let wallet = loadWallet();
let balance = walletTotal();
let roundsPlayed = parseInt(localStorage.getItem('bablosa_rounds')) || 0;
let wins = parseInt(localStorage.getItem('bablosa_wins')) || 0;
let lives = parseInt(localStorage.getItem('bablosa_lives'));
if(isNaN(lives)) lives = LIVES_MAX;
let nextLifeRegenAt = parseInt(localStorage.getItem('bablosa_next_regen')) || null;
if(isNaN(nextLifeRegenAt)) nextLifeRegenAt = null;

// Мягкая pity-система (компенсация серии проигрышей): чисто игровой
// параметр, не продаётся и не покупается ни за реальные деньги, ни за
// внутриигровую валюту — одинаков для всех игроков. Есть небольшой
// базовый перекос в пользу игрока с самого первого раунда (BASE_BIAS),
// а каждый проигрыш подряд дополнительно повышает вероятность того, что
// монеты в следующем раунде лягут на угаданную игроком сторону. Выигрыш
// не обнуляет серию полностью, а лишь наполовину — часть накопленного
// "запаса" сохраняется на будущее. Это не гарантирует исход и не убирает
// случайность — лишь плавно возвращает "невезучего" игрока к балансу,
// снижая эффект длинных проигрышных серий.
let lossStreak = parseInt(localStorage.getItem('bablosa_loss_streak')) || 0;
const BASE_BIAS = 0.15;   // постоянный перекос в пользу игрока — 65/35 в каждом раунде
const PITY_STEP = 0;      // серия проигрышей больше ничего не добавляет сверху
const PITY_MAX = 0;       // ...потому что базовый перекос уже держит потолок 65/35 всегда
// 65/35 действует с первого же раунда и не зависит от серии побед/поражений —
// это не "подушка" на случай неудач, а постоянный перекос вероятности.
function pityBias(){
  return BASE_BIAS + Math.min(lossStreak * PITY_STEP, PITY_MAX);
}

let playerCoins = [];   // {denom, face}
let bankCoins = [];     // {denom, face}
let guess = null, flipping = false;
let denomsLocked = false;
let locked = false;
let intervalId = null, audioCtx = null, regenTickId = null;
let currentStake = 0;

function plural(n,one,few,many){
  const a = Math.abs(n)%100, b = a%10;
  if(a>10 && a<20) return many;
  if(b>1 && b<5) return few;
  if(b===1) return one;
  return many;
}
function randSide(){ return Math.random()<0.5?'H':'T'; }
// Итоговая грань монеты при остановке броска: обычный честный бросок,
// слегка смещённый в сторону угаданной игроком стороны согласно
// pity-бонусу (см. pityBias() выше). Даже при lossStreak=0 сохраняется
// базовый перекос BASE_BIAS в пользу игрока.
function biasedRandSide(){
  if(guess === null) return randSide();
  const p = 0.5 + pityBias();
  const other = guess === 'H' ? 'T' : 'H';
  return Math.random() < p ? guess : other;
}

function selectedSum(arr){
  return arr.reduce((s,c)=>s+c.denom,0);
}

function makeChangeDenoms(target){
  let remaining = target;
  const denoms = [];
  let guardIter = 0;
  while(remaining > 0 && guardIter < 60){
    // Дублируем проверку баланса игрока и здесь (d <= balance), хотя
    // номинал монеты банка и так математически не может превысить сумму
    // ставки, а ставка не может быть больше баланса — это просто
    // дополнительная страховка на случай, если правила формирования
    // ставки в будущем изменятся.
    const options = ALL_DENOMS.filter(d => d <= remaining && d <= balance);
    const d = options.length ? options[options.length - 1] : 1; // ALL_DENOMS отсортирован по возрастанию — берём максимально подходящий номинал
    denoms.push(d);
    remaining -= d;
    guardIter++;
  }
  if(remaining > 0){
    for(let i=0;i<remaining;i++) denoms.push(1);
  }
  return denoms;
}
function bankPreviewForSum(sum){
  if(sum <= 0) return [];
  return makeChangeDenoms(sum).map(d=>({denom:d, face:'T'}));
}

function renderCoinDiv(c, extraClass, clickHandler, showBadge){
  const badge = showBadge ? `<span class="denom-badge">${c.denom}</span>` : '';
  const onclick = clickHandler ? ` onclick="${clickHandler}"` : '';
  return `<div class="coin ${extraClass}"${onclick}><img src="${imgFor(c)}" alt="">${badge}</div>`;
}
// Кнопка-стопка монет (выбор ставки, обменник) — показывает ту же картинку
// монеты, что и уже выложенные монеты в ставке/банке. Количество монет в
// стопке накладывается прямо на картинку монеты в правом нижнем углу — тем
// же бейджем (.denom-badge), что показывает номинал на уже выложенных
// монетах, а не отдельным текстом под картинкой. avail===null — кнопка без
// счётчика (например, выбор целевого номинала в обменнике, где нет своей
// "стопки").
function coinStackBtn(denom, avail, onclick, disabled, active){
  const img = imgFor({denom, face:'T'});
  const count = avail === null ? '' : `<span class="denom-badge">×${avail}</span>`;
  return `<button type="button" class="denom-btn${active?' active':''}" ${disabled?'disabled':''} onclick="${onclick}"><span class="denom-btn-coin"><img class="denom-btn-img" src="${img}" alt="${denom}">${count}</span></button>`;
}
function renderBankCoins(spin, highlight){
  document.getElementById('bankCoins').innerHTML = bankCoins.map(c=>{
    const cls = `bank ${spin?'spin':''} ${highlight && c.face===guess?'matched':''}`;
    // Монета банка, появившаяся только что (новая по сравнению с прошлым
    // предпросмотром), "прилетает" с правой стороны; монеты, уже побывавшие
    // в выигрыше/проигрыше раунда, улетают к кошельку/вправо.
    const wrapCls = c._anim ? c._anim : (c._new ? 'fly-in-right' : '');
    return `<div class="coin-wrap ${wrapCls}">${renderCoinDiv(c, cls, null, flipping ? c.face==='T' : true)}</div>`;
  }).join('') || `<div class="placeholder">Bank's stake will appear here</div>`;
  bankCoins.forEach(c=>{ delete c._new; });
}
function renderPlayerCoins(spin, highlight){
  // Стороны своих монет игрок больше не выбирает вручную (см. stop() —
  // итоговая грань каждой монеты определяется независимым случайным
  // броском в момент "Стоп"), поэтому монеты в стопке ставки не кликабельны
  // для переворота — только для удаления из ставки, пока она не подтверждена.
  document.getElementById('playerCoins').innerHTML = playerCoins.map((c,i)=>{
    const cls = `${spin?'spin':''} ${highlight && c.face===guess?'matched':''}`;
    const coinDiv = renderCoinDiv(c, cls, null, flipping ? c.face==='T' : true);
    const removeBtn = (!flipping && !denomsLocked) ? `<button type="button" class="remove" onclick="removeCoin(${i})">✕</button>` : '';
    // Монета, только что выбранная из кошелька, "прилетает" в поле ставки
    // сверху; после "Стоп" выигранные монеты улетают в кошелек, а
    // проигранные — вправо (см. evaluate()).
    const wrapCls = c._anim ? c._anim : (c._new ? 'fly-in-down' : '');
    return `<div class="coin-wrap ${wrapCls}">${coinDiv}${removeBtn}</div>`;
  }).join('');
  playerCoins.forEach(c=>{ delete c._new; });
}
function renderAll(spin, highlight){
  renderBankCoins(spin, highlight);
  renderPlayerCoins(spin, highlight);
}
function renderStats(){
  document.getElementById('balance').textContent = balance;
  document.getElementById('roundsCount').textContent = roundsPlayed;
  document.getElementById('winsCount').textContent = wins;
  updateGameFlowVisibility();
}
function renderLives(){
  const hearts = Array.from({length:LIVES_MAX}, (_,i)=>
    `<span class="heart ${i<lives?'':'empty'}">${i<lives?'♥':'♡'}</span>`).join('');
  document.getElementById('livesLine').innerHTML = `Lives: ${hearts} (${lives}/${LIVES_MAX})`;
}
function persist(){
  localStorage.setItem('bablosa_wallet', JSON.stringify(wallet));
  localStorage.setItem('bablosa_rounds', roundsPlayed);
  localStorage.setItem('bablosa_wins', wins);
  localStorage.setItem('bablosa_lives', lives);
  localStorage.setItem('bablosa_loss_streak', lossStreak);
  if(nextLifeRegenAt === null){
    localStorage.removeItem('bablosa_next_regen');
  } else {
    localStorage.setItem('bablosa_next_regen', nextLifeRegenAt);
  }
}

function removeCoin(i){
  if(flipping || denomsLocked) return;
  playerCoins.splice(i,1);
  syncBankPreview();
  renderWalletArea();
  renderStakeArea();
  renderAll(false,false);
  updateGuessButtonsAvailability();
}
function addCoin(denom){
  if(flipping || denomsLocked) return;
  if(walletAvailable(denom) <= 0) return;
  playerCoins.push({denom, face:'T', _new:true});
  syncBankPreview();
  renderWalletArea();
  renderStakeArea();
  renderAll(false,false);
  updateGuessButtonsAvailability();
}
// Добавляет в ставку сразу все доступные монеты кошелька (те, что ещё не
// выложены), чтобы не кликать по каждому номиналу отдельно.
function addAllCoins(){
  if(flipping || denomsLocked || walletMode === 'exchange') return;
  let added = false;
  ALL_DENOMS.forEach(d=>{
    const avail = walletAvailable(d);
    for(let i=0;i<avail;i++){
      playerCoins.push({denom:d, face:'T', _new:true});
      added = true;
    }
  });
  if(!added) return;
  syncBankPreview();
  renderWalletArea();
  renderStakeArea();
  renderAll(false,false);
  updateGuessButtonsAvailability();
}
function clearSelection(){
  if(flipping || denomsLocked) return;
  playerCoins = [];
  syncBankPreview();
  renderWalletArea();
  renderStakeArea();
  renderAll(false,false);
  updateGuessButtonsAvailability();
}
function syncBankPreview(){
  // Весь предпросмотр монет банка пересчитывается с нуля при каждом
  // изменении ставки, поэтому "новыми" (которые должны прилететь справа)
  // считаем те монеты каждого номинала, что превышают количество, уже
  // показанное в прошлый раз — это даёт анимацию только реально
  // добавившимся монетам, а не всей стопке при каждом клике.
  const prevCounts = {};
  bankCoins.forEach(c=>{ prevCounts[c.denom] = (prevCounts[c.denom]||0) + 1; });
  const seenCounts = {};
  const next = bankPreviewForSum(selectedSum(playerCoins));
  next.forEach(c=>{
    const k = seenCounts[c.denom] = (seenCounts[c.denom]||0) + 1;
    if(k > (prevCounts[c.denom]||0)) c._new = true;
  });
  bankCoins = next;
}
function updateGuessButtonsAvailability(){
  // Пока ставка не подтверждена (не заблокирована), кнопки "Орёл/Решка"
  // играют двойную роль: клик по любой из них одновременно фиксирует
  // текущую ставку (см. setGuess) и выбирает сторону — отдельная кнопка
  // "Подтвердить монеты" для этого больше не нужна. Доступны, только пока
  // есть хотя бы одна выложенная монета.
  if(denomsLocked) return; // после блокировки доступностью управляет сам setGuess/lockStakeAndPlaceBank
  const enable = playerCoins.length > 0 && !flipping;
  document.getElementById('guessH').disabled = !enable;
  document.getElementById('guessT').disabled = !enable;
}

// ---- Lives: exactly when balance === 0 ----
function useLife(){
  if(balance !== 0 || lives <= 0) return;
  lives--;
  track('life_used', { lives_left: lives, round_in_session: sessionRounds });
  Object.entries(STARTER_SET).forEach(([d,n]) => addToWallet(parseInt(d), n));
  syncBalance();
  if(lives === 0){
    nextLifeRegenAt = Date.now() + LIFE_REGEN_MS;
    startRegenWatch();
  }
  persist();
  renderStats();
  renderLives();
  renderWalletArea();
  // Экран "Баблосы закончились" может появиться сразу после результата
  // раунда, ещё до нажатия "Играть" (denomsLocked всё ещё true) — жизнь
  // в этом случае сразу же обнуляет прошедший раунд, как это делает
  // сама кнопка "Играть", а не только доливает монеты в кошелёк.
  again();
}
function grantRegenLife(){
  lives = Math.min(LIVES_MAX, lives + 1);
  if(lives >= LIVES_MAX){
    // Timer runs continuously from the moment lives hit 0, and only
    // switches off once the count is back up to the full 5.
    nextLifeRegenAt = null;
    stopRegenWatch();
  } else {
    nextLifeRegenAt = Date.now() + LIFE_REGEN_MS;
  }
  persist();
  renderLives();
  renderStakeArea();
  renderOutOfCoins();
}
function startRegenWatch(){
  stopRegenWatch();
  regenTickId = setInterval(()=>{
    if(nextLifeRegenAt !== null && Date.now() >= nextLifeRegenAt){
      grantRegenLife();
    } else {
      renderStakeArea(); // refresh the countdown display
      renderOutOfCoins(); // refresh the countdown in the "out of coins" block too
    }
  }, 1000);
}
function stopRegenWatch(){
  if(regenTickId){ clearInterval(regenTickId); regenTickId = null; }
}
function formatCountdown(ms){
  const total = Math.max(0, Math.ceil(ms/1000));
  const m = Math.floor(total/60);
  const s = total%60;
  return `${m}:${s<10?'0':''}${s}`;
}

// ---- Единый кошелёк ----
// Монеты кошелька одни и те же и для ставки, и для обмена: внешний вид
// не меняется (та же кнопка-стопка coinStackBtn), меняется только то, что
// происходит по клику — это определяет текущий режим (walletMode).
// Ставка — режим по умолчанию, монеты сразу доступны для клика без
// дополнительного нажатия. "Обменять монеты" — единственный переключатель:
// он временно переводит кошелёк в режим обмена, повторный клик возвращает
// обратно к ставке.
let walletMode = 'stake'; // 'stake' | 'exchange'

function renderWalletArea(){
  const el = document.getElementById('walletArea');
  const denoms = ALL_DENOMS.filter(d => (wallet[d]||0) > 0);
  const busy = flipping || denomsLocked;
  const stakeAllBtn = document.getElementById('stakeAllBtn');
  if(stakeAllBtn){
    const hasAvailable = walletMode !== 'exchange' && ALL_DENOMS.some(d => walletAvailable(d) > 0);
    stakeAllBtn.style.display = walletMode === 'exchange' ? 'none' : '';
    stakeAllBtn.disabled = busy || !hasAvailable;
  }
  if(denoms.length === 0){
    el.innerHTML = `<div class="placeholder">No coins yet</div>`;
    return;
  }
  const buttons = denoms.map(d=>{
    let avail, onclick;
    if(walletMode === 'exchange'){
      avail = exAvailable(d);
      onclick = `addExCoin(${d})`;
    } else {
      avail = walletAvailable(d);
      onclick = `addCoin(${d})`;
    }
    const disabled = busy || avail <= 0;
    return coinStackBtn(d, avail, onclick, disabled, false);
  }).join('');
  el.innerHTML = `<div class="palette">${buttons}</div>`;
}

// Переключение в режим обмена и обратно в ставку.
function toggleExchange(){
  if(flipping || denomsLocked) return;
  walletMode = (walletMode === 'exchange') ? 'stake' : 'exchange';
  const exArea = document.getElementById('exchangeArea');
  if(walletMode === 'exchange'){
    exGiveCounts = {};
    exToDenom = null;
    exArea.style.display = 'block';
    renderExchangeArea();
  } else {
    exArea.style.display = 'none';
  }
  renderWalletArea();
  renderStakeArea();
  updateModeButtonsUI();
}

function updateModeButtonsUI(){
  const busy = flipping || denomsLocked;
  if(busy && walletMode !== 'stake'){
    walletMode = 'stake';
    document.getElementById('exchangeArea').style.display = 'none';
  }
  const exBtn = document.getElementById('toggleExchangeBtn');
  exBtn.disabled = busy;
  exBtn.classList.toggle('active', walletMode === 'exchange');
}

// Блоки "Монеты банка" и "Угадай каких монет будет больше" не несут смысла,
// пока игрок не выбрал ни одной монеты для ставки — до этого момента их
// прячем, чтобы не показывать пустой/бессмысленный интерфейс.
function updateBankGuessVisibility(visible){
  document.getElementById('bankSection').style.display = visible ? '' : 'none';
  document.getElementById('guessSection').style.display = visible ? '' : 'none';
}

// ---- Поле ставки (раскрывается кнопкой "Сделать ставку") ----
function renderStakeArea(){
  const wrap = document.getElementById('stakeArea');
  const info = document.getElementById('stakeInfoArea');
  const bankSection = document.getElementById('bankSection');
  const bankLabel = document.getElementById('bankLabel');
  const inGameLabel = document.getElementById('inGameLabel');
  const walletHint = document.getElementById('walletHint');

  if(denomsLocked){
    // Ставка уже зафиксирована — поле остаётся видимым, чтобы монеты
    // ставки не пропадали из виду во время раунда, но без органов
    // управления (их заменили кнопки "Орёл/Решка"). С этого момента блоки
    // "Ваша ставка" и "Монеты банка" визуально объединяются в один блок
    // "Монеты в игре", показывающий монеты и игрока, и банка вместе.
    const merged = playerCoins.length > 0;
    wrap.style.display = merged ? 'block' : 'none';
    info.innerHTML = '';
    walletHint.textContent = '';
    wrap.classList.toggle('merge-top', merged);
    bankSection.classList.toggle('merge-bottom', merged);
    bankLabel.style.display = merged ? 'none' : '';
    inGameLabel.style.display = merged ? '' : 'none';
    updateBankGuessVisibility(true);
    return;
  }

  wrap.classList.remove('merge-top');
  bankSection.classList.remove('merge-bottom');
  bankLabel.style.display = '';
  inGameLabel.style.display = 'none';

  const show = walletMode !== 'exchange';
  if(!show){
    wrap.style.display = 'none';
    info.innerHTML = '';
    walletHint.textContent = '';
    updateBankGuessVisibility(false);
    return;
  }
  // balance === 0 больше не обрабатывается здесь: в этом случае вся
  // gameplayArea скрыта целиком (см. updateGameFlowVisibility), а варианты
  // восстановления баланса показывает renderOutOfCoins().

  const denoms = ALL_DENOMS.filter(d => (wallet[d]||0) > 0);
  const sum = selectedSum(playerCoins);
  if(denoms.length === 0){
    wrap.style.display = 'block';
    info.innerHTML = `<div class="warn">You have no coins for a new stake</div>`;
    walletHint.textContent = '';
    updateBankGuessVisibility(false);
    return;
  }
  if(sum > 0){
    wrap.style.display = 'block';
    info.innerHTML = `<div class="stake-line">
         <span class="stake-label">Your stake:</span>
         <span class="stake-amount">${sum}B of ${balance}B</span>
         <button type="button" class="clear-btn" onclick="clearSelection()">Clear</button>
       </div>`;
    walletHint.textContent = '';
    updateBankGuessVisibility(true);
  } else {
    // Ни одной монеты не выбрано — пустой блок "Ваша ставка" не показываем,
    // чтобы между "Ваш кошелек" и "Монеты банка" не было пустой панели, а
    // также прячем "Монеты банка" и "Угадай каких монет будет больше" —
    // они не имеют смысла до выбора игроком своих монет.
    wrap.style.display = 'none';
    info.innerHTML = '';
    walletHint.textContent = 'Select coins to stake';
    updateBankGuessVisibility(false);
  }
}

function setupRoundCoins(){
  playerCoins = [];
  syncBankPreview();
  renderWalletArea();
  renderStakeArea();
  renderAll(false,false);
  updateGuessButtonsAvailability();
}

function ensureAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
}
function beep(freq,dur,type,vol){
  if(!audioCtx) return;
  try{
    const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
    osc.type=type; osc.frequency.value=freq; gain.gain.value=vol;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    osc.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function playSound(type){
  if(type==='click') beep(600,0.05,'square',0.15);
  if(type==='win'){ beep(880,0.12,'sine',0.2); setTimeout(()=>beep(1320,0.15,'sine',0.2),110); }
  if(type==='lose') beep(150,0.3,'sawtooth',0.15);
}

// Раньше подтверждение ставки было отдельной кнопкой ("Подтвердить
// монеты"), после которой отдельно выбиралась сторона. Кнопка была лишним
// кликом: выбор "Орёл/Решка" по смыслу и так означает "я закончил
// собирать ставку и готов угадывать" — поэтому клик по любой из этих
// кнопок сам фиксирует ставку (если она ещё не зафиксирована) и сразу
// выбирает сторону, одним действием.
function lockStakeAndPlaceBank(side){
  currentStake = selectedSum(playerCoins);
  // Ставка и так ограничена физическими монетами в кошельке (addCoin
  // проверяет walletAvailable), поэтому дополнительная проверка баланса
  // не нужна — сами монеты остаются в кошельке до объявления результата.
  denomsLocked = true;
  persist();
  renderStats();
  renderWalletArea();
  renderStakeArea();
  updateModeButtonsUI();

  ensureAudio();
  playSound('click');
  // Монеты банка сразу лежат номиналом вверх (face:'T'), как и монеты
  // игрока, без промежуточного "переворота" — он был чисто декоративным
  // и ни на что не влиял: итоговая грань всё равно определяется
  // независимым случайным броском в stop(), а до "Встряхнуть" все монеты
  // просто лежат на своей стороне.
  locked = true;
  guess = side;
  document.getElementById('guessH').classList.toggle('active', side==='H');
  document.getElementById('guessT').classList.toggle('active', side==='T');
  document.getElementById('guessH').disabled = false;
  document.getElementById('guessT').disabled = false;
  document.getElementById('shakeBtn').disabled = false;
  renderAll(false,false);
}

function setGuess(side){
  if(flipping) return;
  if(!denomsLocked){
    if(playerCoins.length === 0) return;
    lockStakeAndPlaceBank(side);
    return;
  }
  if(!locked) return;
  guess = side;
  document.getElementById('guessH').classList.toggle('active', side==='H');
  document.getElementById('guessT').classList.toggle('active', side==='T');
  document.getElementById('shakeBtn').disabled = !guess;
}

// Скорость переворота монет фиксирована и не зависит от баланса игрока —
// с тех пор как реальный результат определяется отдельным случайным
// броском в момент нажатия "Стоп" (см. stop()), скорость анимации влияет
// только на внешний вид, а не на честность игры.
const FLIP_INTERVAL = 250; // ms

function shake(){
  if(!guess || !locked) return;
  ensureAudio();
  flipping = true;
  document.getElementById('shakeBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;
  document.getElementById('result').textContent = '';
  document.getElementById('result').className = 'result';
  playSound('click');

  const interval = FLIP_INTERVAL;
  document.documentElement.style.setProperty('--flip-dur', (interval/1000)+'s');

  intervalId = setInterval(()=>{
    playerCoins.forEach(c=> c.face = c.face==='H'?'T':'H');
    bankCoins.forEach(c=> c.face = c.face==='H'?'T':'H');
    renderAll(true,false);
  }, interval);
}
function stop(){
  clearInterval(intervalId);
  flipping = false;
  document.getElementById('stopBtn').disabled = true;
  document.getElementById('guessH').disabled = true;
  document.getElementById('guessT').disabled = true;
  playSound('click');
  // Итоговый результат каждой монеты — независимый случайный бросок в момент
  // остановки. Он НЕ зависит от того, какая грань была видна на экране во
  // время вращения — визуальное мелькание монет чисто декоративное и никак
  // не связано с реальным исходом раунда. Это исключает возможность
  // "подгадать" момент нажатия кнопки "Стоп" по ритму анимации.
  playerCoins.forEach(c=> c.face = biasedRandSide());
  bankCoins.forEach(c=> c.face = biasedRandSide());
  evaluate();
}
function evaluate(){
  const ownMatchedCoins = playerCoins.filter(c=>c.face===guess);
  const ownLostCoins = playerCoins.filter(c=>c.face!==guess);
  const bankMatchedCoins = bankCoins.filter(c=>c.face===guess);
  const matchedCount = ownMatchedCoins.length + bankMatchedCoins.length;
  const creditValue = selectedSum(ownMatchedCoins) + selectedSum(bankMatchedCoins);
  const net = creditValue - currentStake;

  if(net === 0){
    // Точная ничья 50/50 по сумме номиналов всех монет (и игрока, и
    // банка) — раунд не засчитывается: кошелёк не трогаем, статистика
    // не меняется. Игрок может повторить бросок с теми же монетами и
    // тем же выбором стороны, нажав "Встряхнуть" ещё раз.
    const resEl = document.getElementById('result');
    resEl.className = 'result';
    resEl.innerHTML = `Tie 50/50 by coin sum — round not counted<span class="sub">Press “Shake” to retry with the same coins</span>`;
    track('round_tie', { stake: currentStake, round_in_session: sessionRounds });
    playSound('click');
    renderAll(false,false);
    document.getElementById('shakeBtn').disabled = false;
    return;
  }

  roundsPlayed++;
  sessionRounds++;
  // Угаданные свои монеты остаются в кошельке (их не трогали при
  // подтверждении ставки). Проигранные свои монеты уходят из кошелька.
  // Угаданные монеты банка пополняют кошелёк по своему номиналу.
  ownLostCoins.forEach(c => removeFromWallet(c.denom, 1));
  bankMatchedCoins.forEach(c => addToWallet(c.denom, 1));
  syncBalance();
  const resEl = document.getElementById('result');
  // Выиграно/Проиграно — положительная/отрицательная разница между
  // суммой номиналов выставленных игроком монет (currentStake) и суммой
  // номиналов выигранных игроком монет (creditValue).
  const diff = creditValue - currentStake;
  const wonAmount = diff > 0 ? diff : 0;
  const lostAmount = diff < 0 ? -diff : 0;
  resEl.innerHTML = `Won: ${wonAmount} B; Lost: ${lostAmount} B`;
  track('round_played', {
    result: net > 0 ? 'win' : 'loss',
    stake: currentStake,
    net: net,
    round_in_session: sessionRounds,
    total_rounds: roundsPlayed,
    balance_after: balance,
    guess: guess
  });
  if(net > 0){ wins++; lossStreak = Math.floor(lossStreak/2); resEl.classList.add('win'); playSound('win'); }
  else if(net < 0){ lossStreak++; resEl.classList.add('lose'); playSound('lose'); }
  else { playSound('click'); }
  // Выигранные монеты (свои угаданные + угаданные монеты банка) улетают
  // из поля "Монеты в игре" в кошелек; проигранные свои монеты улетают
  // вправо. Помечаем их классом анимации перед рендером, а после того как
  // анимация визуально доиграет — убираем из отображаемых массивов (сам
  // кошелёк уже обновлён выше, это чисто визуальная чистка поля раунда).
  ownMatchedCoins.forEach(c=> c._anim = 'fly-to-wallet');
  bankMatchedCoins.forEach(c=> c._anim = 'fly-to-wallet');
  ownLostCoins.forEach(c=> c._anim = 'fly-out-right');
  renderAll(false,true);
  persist();
  renderStats();
  renderWalletArea();
  document.getElementById('againBtn').style.display = 'block';
  setTimeout(()=>{
    playerCoins = playerCoins.filter(c => !ownMatchedCoins.includes(c) && !ownLostCoins.includes(c));
    bankCoins = bankCoins.filter(c => !bankMatchedCoins.includes(c));
    renderAll(false,false);
  }, 520);
}
function again(){
  guess = null; denomsLocked = false; locked = false; currentStake = 0;
  document.getElementById('guessH').classList.remove('active');
  document.getElementById('guessT').classList.remove('active');
  document.getElementById('bankNote').textContent = '';
  setupRoundCoins();
  updateModeButtonsUI();
  document.getElementById('shakeBtn').disabled = true;
  document.getElementById('stopBtn').disabled = true;
  document.getElementById('againBtn').style.display = 'none';
  document.getElementById('result').textContent = '';
  document.getElementById('result').className = 'result';
}

document.getElementById('shakeBtn').addEventListener('click', shake);
document.getElementById('stopBtn').addEventListener('click', stop);
document.getElementById('againBtn').addEventListener('click', again);
document.getElementById('guessH').addEventListener('click', ()=>setGuess('H'));
document.getElementById('guessT').addEventListener('click', ()=>setGuess('T'));

function resetProgress(){
  stopRegenWatch();
  clearInterval(intervalId);
  localStorage.removeItem('bablosa_balance');
  localStorage.removeItem('bablosa_wallet');
  localStorage.removeItem('bablosa_rounds');
  localStorage.removeItem('bablosa_wins');
  localStorage.removeItem('bablosa_lives');
  localStorage.removeItem('bablosa_next_regen');
  location.reload();
}
document.getElementById('resetBtn').addEventListener('click', resetProgress);

// ---- Обменник монет ----
// Пока бесплатно и без ограничений (реклама/лимиты — отдельный шаг позже).
// Игрок сам выкладывает монеты на обмен кликами по стопкам своего
// кошелька — точно так же, как при сборе ставки — и отдельно кликом
// выбирает номинал, в который хочет их превратить. Курс обмена 1:1 по
// ценности: сумма отданных монет конвертируется в максимум монет
// выбранного номинала, а остаток (если сумма не делится ровно)
// возвращается монетами по 1 — так обмен всегда возможен в любую
// сторону и никогда не создаёт и не теряет ценность.
let exGiveCounts = {};   // denom -> сколько монет этого номинала выложено на обмен
let exToDenom = null;    // выбранный номинал получения

function exGiveCount(d){ return exGiveCounts[d] || 0; }
function exAvailable(d){ return (wallet[d]||0) - exGiveCount(d); }
function exGiveTotal(){
  return Object.entries(exGiveCounts).reduce((s,[d,n]) => s + parseInt(d)*n, 0);
}

function addExCoin(d){
  if(flipping || denomsLocked) return;
  if(exAvailable(d) <= 0) return;
  exGiveCounts[d] = (exGiveCounts[d]||0) + 1;
  renderWalletArea();
  renderExchangeArea();
}
function removeExCoin(d){
  if(flipping || denomsLocked) return;
  if(exGiveCount(d) <= 0) return;
  exGiveCounts[d]--;
  if(exGiveCounts[d] <= 0) delete exGiveCounts[d];
  renderWalletArea();
  renderExchangeArea();
}
function clearExSelection(){
  exGiveCounts = {};
  renderWalletArea();
  renderExchangeArea();
}
function setExToDenom(d){
  exToDenom = parseInt(d);
  renderExchangeArea();
}

function renderExchangeArea(){
  const el = document.getElementById('exchangeArea');
  const owned = ALL_DENOMS.filter(d => (wallet[d]||0) > 0);
  if(owned.length === 0){
    el.innerHTML = `<div class="placeholder">Nothing to exchange — no coins</div>`;
    return;
  }
  // Крупные номиналы появляются как цель обмена только когда баланс
  // игрока их "оправдывает" — доступны только те, что не больше текущего
  // баланса. Как только баланс падает ниже номинала, эта цель пропадает
  // из списка (уже полученные ранее такие монеты никуда не деваются —
  // ограничение касается только получения новых через обмен).
  const unlockedToDenoms = ALL_DENOMS.filter(d => d <= balance);
  if(!exToDenom || !unlockedToDenoms.includes(exToDenom)){
    exToDenom = unlockedToDenoms.find(d => !exGiveCounts[d]) || unlockedToDenoms[0] || null;
  }

  const stagedDenoms = Object.keys(exGiveCounts).map(Number).filter(d => exGiveCounts[d] > 0).sort((a,b)=>a-b);
  const stagedHtml = stagedDenoms.length
    ? `<div class="wallet-overview">${stagedDenoms.map(d=>`<span class="wallet-chip removable" onclick="removeExCoin(${d})">${d}<span class="chip-count">×${exGiveCount(d)} ✕</span></span>`).join('')}</div>`
    : '';

  const toButtons = unlockedToDenoms.map(d=>{
    return coinStackBtn(d, null, `setExToDenom(${d})`, false, d===exToDenom);
  }).join('') || `<span class="placeholder" style="font-size:.75rem;">No denominations available — balance too low</span>`;

  const value = exGiveTotal();
  const targetCount = exToDenom ? Math.floor(value / exToDenom) : 0;
  const remainder = exToDenom ? value - targetCount*exToDenom : 0;

  el.innerHTML = `
    <div class="exchange-row" style="flex-direction:column; align-items:stretch;">
      <span>You give — click coins in your wallet above:</span>
      <div class="stake-line">
        <span>Exchanging: ${value} bablos</span>
        <button type="button" class="clear-btn" onclick="clearExSelection()">Clear</button>
      </div>
      ${stagedHtml}
    </div>
    <div class="exchange-row" style="flex-direction:column; align-items:stretch;">
      <span>Receive denomination:</span>
      <div class="palette">${toButtons}</div>
    </div>
    <div class="exchange-preview">${value>0 ? `You give ${value} bablos → you get ${targetCount}×${exToDenom}${remainder>0?` + ${remainder}×1 change`:''}` : 'Place the coins you want to exchange'}</div>
    <button type="button" class="exchange-confirm" onclick="doExchange()" ${value<=0?'disabled':''}>Exchange</button>
  `;
}

function doExchange(){
  if(flipping || denomsLocked) return;
  const value = exGiveTotal();
  if(value <= 0 || !exToDenom) return;
  const targetCount = Math.floor(value / exToDenom);
  const remainder = value - targetCount*exToDenom;
  track('coin_exchange', { value: value, to_denom: exToDenom, round_in_session: sessionRounds });

  Object.entries(exGiveCounts).forEach(([d,n]) => { if(n > 0) removeFromWallet(parseInt(d), n); });
  if(targetCount > 0) addToWallet(exToDenom, targetCount);
  if(remainder > 0) addToWallet(1, remainder);

  exGiveCounts = {};
  exToDenom = null;
  syncBalance();
  persist();
  renderStats();
  // После обмена сектор сворачивается обратно в исходное (закрытое)
  // состояние — как было до нажатия "Обменять монеты" — вместо того
  // чтобы оставаться открытым с уже обнулённым выбором.
  walletMode = 'stake';
  document.getElementById('exchangeArea').style.display = 'none';
  document.getElementById('exchangeArea').innerHTML = '';
  updateModeButtonsUI();
  renderWalletArea();
  renderStakeArea();
}

document.getElementById('toggleExchangeBtn').addEventListener('click', toggleExchange);
document.getElementById('stakeAllBtn').addEventListener('click', addAllCoins);

// ---- Экран "Баблосы закончились" ----
// Показывается вместо всей игровой области (кошелёк, ставка, банк, угадайка,
// управление), как только баланс кошелька опускается до 0 — независимо от
// того, идёт ли ещё показ результата раунда или нет. Даёт игроку ровно два
// пути вернуться в игру: потратить жизнь (полный стартовый набор монет) или
// посмотреть рекламу за меньшую, но мгновенную награду. В финальной версии
// сюда же будет вести и обязательный показ рекламы (раз в N раундов или
// после крупного выигрыша) — см. обсуждение частоты в чате.
const AD_LIFE_REWARD = 5; // сумма, которую даёт разовый просмотр рекламы здесь
function renderOutOfCoins(){
  const box = document.getElementById('outOfCoinsSection');
  if(balance !== 0){
    box.style.display = 'none';
    box.innerHTML = '';
    return;
  }
  const leftBtn = lives > 0
    ? `<button type="button" class="recover-btn life" onclick="useLife()">Use a Life<span class="sub">+${LIFE_VALUE}B · ${lives}/${LIVES_MAX} left</span></button>`
    : `<button type="button" class="recover-btn life" disabled>Out of Lives<span class="sub" id="lifeRegenTimerMain"></span></button>`;
  box.style.display = 'block';
  box.innerHTML = `
    <div class="label">Out of Bablos</div>
    <div class="recover-row">
      ${leftBtn}
      <div class="recover-or">or</div>
      <button type="button" class="recover-btn ad" id="watchAdBtnMain">Watch Ad<span class="sub">+${AD_LIFE_REWARD}B</span></button>
    </div>`;
  document.getElementById('watchAdBtnMain').addEventListener('click', watchAdForCoins);
  if(lives === 0){
    const remain = nextLifeRegenAt ? nextLifeRegenAt - Date.now() : LIFE_REGEN_MS;
    document.getElementById('lifeRegenTimerMain').textContent = `Next life in ${formatCountdown(remain)}`;
  }
}
function watchAdForCoins(){
  if(balance !== 0) return;
  const btn = document.getElementById('watchAdBtnMain');
  if(!btn) return;
  btn.disabled = true;
  btn.innerHTML = 'Showing ad…';
  // Здесь позже подключится реальный SDK показа рекламы; пока — заглушка
  // с небольшой задержкой, имитирующей просмотр ролика.
  setTimeout(()=>{
    track('ad_watched', { reward: AD_LIFE_REWARD, round_in_session: sessionRounds });
    addToWallet(AD_LIFE_REWARD, 1); // одна монета нужного номинала
    syncBalance();
    persist();
    renderStats();
    renderWalletArea();
    // Так же, как и жизнь (см. useLife), сразу обнуляет прошедший раунд,
    // если экран появился ещё до нажатия "Играть".
    again();
  }, 1200);
}
// Обновляет видимость всей игровой области в зависимости от баланса:
// при balance === 0 весь игровой процесс (кошелёк, ставка, банк, угадайка,
// управление) скрывается, остаётся только один блок восстановления выше.
function updateGameFlowVisibility(){
  document.getElementById('gameplayArea').style.display = balance === 0 ? 'none' : '';
  renderOutOfCoins();
}

// Catch up on regen if the page was closed past one or more deadlines,
// then resume the countdown (the timer runs continuously from lives=0
// until lives is back up to the full 5).
if(nextLifeRegenAt !== null && lives < LIVES_MAX){
  while(nextLifeRegenAt !== null && Date.now() >= nextLifeRegenAt && lives < LIVES_MAX){
    lives = Math.min(LIVES_MAX, lives + 1);
    nextLifeRegenAt = (lives >= LIVES_MAX) ? null : (nextLifeRegenAt + LIFE_REGEN_MS);
  }
  persist();
  if(nextLifeRegenAt !== null){
    startRegenWatch();
  }
}

renderLives();
setupRoundCoins();
renderStats();
renderWalletArea();
updateModeButtonsUI();
track('session_start', { total_rounds: roundsPlayed, lives: lives, balance: balance });
</script>
